name: Verificar catálogo estático
on:
  push:
    branches: [main, feature/firebase-catalogo]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript como módulos
        run: |
          for file in instagram-links.js instagram-admin.js catalog-public-snapshot.js catalog-emergency.js customer-client.js cuenta.js price-bulk.js solicitud.js catalog-pricing.js pricing-admin.js admin-navigation.js admin-product-filters.js admin.js app.js catalogo.js public-catalog.js config.js data-client.js firebase-client.js catalog-service.js cloudinary-upload-worker.js brand-admin.js brand-management.js storefront-settings.js design-admin.js bulk-import.js contact-admin.js contact-links.js quote-cart.js catalog-public-data.js catalog-images.js welcome.js welcome-routing.js welcome-admin.js catalog-analytics.js analytics-admin.js analytics-summary.js analytics-quality.js backup-utils.js backup-admin.js; do
            node --input-type=module --check < "$file"
          done
      - name: Construir y probar respaldo público offline sin Firestore
        run: node scripts/build-static-catalog-tests.mjs
      - name: Probar copia completa de banners, marcas y precios sin Firebase
        run: node scripts/create-public-snapshot-tests.mjs
      - name: Probar sincronización ligera al guardar cambios en administración
        run: node scripts/sync-public-catalog-tests.mjs
      - name: Verificar alertas de precios vencidos y cotización sin cambios privados
        run: node scripts/check-public-snapshot-health-tests.mjs
      - name: Probar catálogo y solicitudes en contingencia sin Firebase
        run: node catalog-emergency-tests.mjs
      - name: Comprobar sintaxis de Cloud Functions privadas
        run: |
          node --check functions/index.js
          node --check functions/customer-core.cjs
      - name: Probar portal opcional y protección de cotizaciones
        run: node customer-portal-tests.mjs
      - name: Comprobar filtros de productos en administración
        run: node admin-product-filters-tests.mjs
      - name: Verificar navegación compacta sin cambios de datos
        run: node admin-navigation-tests.mjs
      - name: Validar precios USD y tasa BCV con seguridad
        run: node catalog-pricing-tests.mjs
      - name: Probar ajuste masivo, importación segura y reversión
        run: node price-bulk-tests.mjs
      - name: Verificar lectura e importación de CSV
        run: node bulk-import-tests.mjs
      - name: Verificar gestión y corrección segura de marcas
        run: node brand-management-tests.mjs
      - name: Probar presentación editable y vista previa sin publicar
        run: node storefront-tests.mjs
      - name: Verificar enlaces y cuentas oficiales de Instagram
        run: node instagram-links-tests.mjs
      - name: Verificar consultas por WhatsApp
        run: node whatsapp-tests.mjs
      - name: Probar carrito sin precios y cotización conjunta
        run: node quote-cart-tests.mjs
      - name: Comprobar rendimiento, consultas públicas y fotos
        run: node catalog-performance-tests.mjs
      - name: Comprobar portada y botón de entrada
        run: node welcome-tests.mjs
      - name: Verificar contador privado e historial por meses
        run: node analytics-tests.mjs
      - name: Probar respaldo privado sin escrituras
        run: node backup-tests.mjs
      - name: Comprobar SEO y calidad del contador
        run: node seo-quality-tests.mjs
      - name: Validar enlaces y reglas mínimas
        run: |
          grep -q 'catalogPublic' firestore.rules
          grep -q 'catalogAdmins' firestore.rules
          grep -q 'firestore.exists' storage.rules
          grep -q 'FIREBASE_SETUP.md' README.md
