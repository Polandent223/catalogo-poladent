name: Verificar catálogo estático
on:
  push:
    branches: [main, feature/firebase-catalogo]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript como módulos
        run: |
          for file in admin.js app.js catalogo.js public-catalog.js config.js data-client.js firebase-client.js catalog-service.js cloudinary-upload-worker.js brand-admin.js brand-management.js bulk-import.js contact-admin.js contact-links.js quote-cart.js catalog-public-data.js catalog-images.js welcome.js welcome-routing.js welcome-admin.js catalog-analytics.js analytics-admin.js analytics-summary.js analytics-quality.js backup-utils.js backup-admin.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verificar lectura e importación de CSV
        run: node bulk-import-tests.mjs
      - name: Verificar gestión y corrección segura de marcas
        run: node brand-management-tests.mjs
      - name: Verificar consultas por WhatsApp
        run: node whatsapp-tests.mjs
      - name: Probar carrito sin precios y cotización conjunta
        run: node quote-cart-tests.mjs
      - name: Comprobar rendimiento, consultas públicas y fotos
        run: node catalog-performance-tests.mjs
      - name: Comprobar portada y botón de entrada
        run: node welcome-tests.mjs
      - name: Verificar contador privado e historial por meses
        run: node analytics-tests.mjs
      - name: Probar respaldo privado sin escrituras
        run: node backup-tests.mjs
      - name: Comprobar SEO y calidad del contador
        run: node seo-quality-tests.mjs
      - name: Validar enlaces y reglas mínimas
        run: |
          grep -q 'catalogPublic' firestore.rules
          grep -q 'catalogAdmins' firestore.rules
          grep -q 'firestore.exists' storage.rules
          grep -q 'FIREBASE_SETUP.md' README.md
