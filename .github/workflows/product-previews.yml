name: Vistas previas de productos para WhatsApp
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Cambios de administrador, diseño y cuentas no requieren volver a leer
    # todo Firestore. Las fotos de nuevos productos se regeneran por cron/manual.
    paths:
      - 'scripts/generate-product-share.mjs'
      - 'scripts/product-preview-tests.mjs'
      - 'scripts/build-static-catalog.mjs'
      - 'scripts/build-static-catalog-tests.mjs'
      - 'scripts/create-public-snapshot.mjs'
      - 'scripts/create-public-snapshot-tests.mjs'
      - 'scripts/sync-public-catalog.mjs'
      - 'scripts/sync-public-catalog-tests.mjs'
      - 'firebase-client.js'
      - '.github/workflows/product-previews.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
concurrency:
  group: poladent-publicacion-estatica
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Las ejecuciones programadas repetidas pueden apuntar a un commit antiguo:
          # leer SIEMPRE la última main antes de generar y publicar el respaldo.
          # Los PR siguen validando exclusivamente su propio código.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar HTML para redes sociales
        run: node scripts/product-preview-tests.mjs
      # Los PR validan HTML sin consumir cuota de Firestore para cada commit.
      # La regeneración real solo ocurre en main, tareas programadas o ejecución manual.
      - name: Comprobar revisión pública y sincronizar SOLO si cambió
        if: github.event_name != 'pull_request'
        run: |
          if node scripts/sync-public-catalog.mjs; then
            echo "Conservar el último diseño aprobado. Sin nuevas lecturas por cada visitante."
          else
            echo "::warning::No hay acceso a una captura íntegra de Firebase. Se conserva intacta la anterior y la contingencia."
          fi
      - name: Actualizar vistas previas desde la copia pública sin consumir Firebase
        if: github.event_name != 'pull_request'
        run: |
          if [ -f catalog-public-snapshot.json ]; then
            if ! node scripts/generate-product-share.mjs --from-snapshot-only; then
              echo "::warning::El respaldo íntegro no está vigente. Se conservan las vistas previas originales."
            fi
          else
            echo "Todavía no existe captura completa original: se mantienen intactas las 255 fichas."
          fi
      - name: Crear respaldo seguro a partir de fichas públicas existentes
        if: github.event_name != 'pull_request'
        run: |
          node scripts/build-static-catalog.mjs
          node scripts/build-static-catalog-tests.mjs
      - name: Actualizar vistas previas y solicitar publicación
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A share/ catalog-emergency-backup.json
          if [ -f catalog-public-snapshot.json ] && [ -f catalog-welcome-snapshot.json ]; then
            git add catalog-public-snapshot.json catalog-welcome-snapshot.json
          fi
          if git diff --cached --quiet; then
            echo "Vistas previas al día, sin cambios."
          else
            git commit -m "Actualizar vistas previas de productos [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Actualizados los HTML públicos; solicitando nueva publicación de GitHub Pages"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "::warning::No se pudo forzar Pages. Revisar configuración de GitHub Pages."
          fi
